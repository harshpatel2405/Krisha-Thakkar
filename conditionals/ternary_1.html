<body>



    <script>
        let a = 12;

        (a > 18) ? console.log("Can Vote") : console.log("Cannot Vote");

        let ans = (a > 18) ? "true":"false";
        console.log(ans)

        // nested ternary operator 
        a = 100
        let b = 200
        let c = 30

        ans = (a>b) ? ((a>c) ? (a)  :(c)) : ((b>c) ? (b):(c))
        console.log(ans + " is greater")
    </script>
