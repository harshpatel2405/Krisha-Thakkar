<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <script>
        let choice = parseInt(prompt("1. Spring\n2. Summer\n3. Monsoon\n4. Winter\nSelect your choice"))

        switch (choice) {
            case 1: console.log("Season : Spring")
                break;
            case 2: console.log("Season : Summer")
                break;
            case 3: console.log("Season : Monsoon")
                break;
            case 4: console.log("Season : Winter")
                break;
            default: console.log("Select season between 1 and 4")
        }

    </script>
</body>

</html>
